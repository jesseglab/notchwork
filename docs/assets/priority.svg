<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="390" viewBox="0 0 1440 390" role="img" aria-labelledby="title desc"><title id="title">Priority gets a moment, not the whole screen.</title><desc id="desc">An assigned app occupies a slot. An allowed urgent alert temporarily replaces it. Once dismissed or expired, the assigned app returns.</desc><rect width="1440" height="390" rx="24" fill="#0a0c0b"/><g font-family="Arial,Helvetica,sans-serif"><text x="64" y="64" fill="#f5f6ef" font-size="28" font-weight="600">Priority gets a moment, not the whole screen.</text><text x="64" y="98" fill="#8f9c94" font-size="16">You decide which apps can interrupt. Each slot can opt out.</text><g fill="#121a15" stroke="#2f4738"><rect x="64" y="143" width="376" height="134" rx="18"/><rect x="532" y="143" width="376" height="134" rx="18" fill="#221b10" stroke="#795d2e"/><rect x="1000" y="143" width="376" height="134" rx="18"/></g><g font-size="12" letter-spacing="2" fill="#86a18e"><text x="88" y="177">USUAL APP</text><text x="1024" y="177">BACK IN PLACE</text><text x="556" y="177" fill="#ffce79">ALLOWED PRIORITY</text></g><g font-size="24" fill="#e9f1eb"><text x="88" y="227">Build status</text><text x="556" y="227">Action needed</text><text x="1024" y="227">Build status</text></g><g stroke="#7e9d88" stroke-width="2" fill="none"><path d="M464 209h42m-8-8 8 8-8 8"/><path d="M932 209h42m-8-8 8 8-8 8"/></g><g fill="#8f9c94" font-size="14"><text x="64" y="320">Stable until something needs you.</text><text x="532" y="320">No forced panel opening or focus stealing.</text><text x="1000" y="320">Dismissed or expired. Automatically restored.</text></g><text x="64" y="366" font-size="11" fill="#596960">ILLUSTRATED BEHAVIOR</text></g></svg>
