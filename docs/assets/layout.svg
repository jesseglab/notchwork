<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">Four places. One workspace.</title><desc id="desc">Illustrated layout of Notchwork: three slots on either side of the camera notch, and independent drawers at the left and right edges. Example activities are demonstrations, not connected integrations.</desc>
